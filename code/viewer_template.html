<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Trace Mining – Variant 06</title>
<style>
body{font:14px/1.45 system-ui,Segoe UI,sans-serif;margin:24px;color:#1d2433;background:#f7f8fa}
h1{font-size:20px;margin:0 0 4px}.sub{color:#5b6475;margin-bottom:16px}
.uc{background:#fff;border:1px solid #dde1e8;border-radius:8px;margin:10px 0;padding:10px 14px}
summary{cursor:pointer;display:flex;gap:12px;align-items:center}
.name{font-weight:600;flex:0 0 340px}.bar{flex:1;height:10px;background:#eef0f4;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:#3b6fd8}.num{flex:0 0 380px;text-align:right;color:#3d4556;font-variant-numeric:tabular-nums}
.wf{margin:6px 0 6px 18px;padding:6px 10px;border-left:3px solid #c9d4ea}.wf .name{font-weight:500;flex-basis:322px}
.wf .bar i{background:#7aa0e6}.ex{font-size:12px;color:#4a5263;margin:4px 0 4px 18px}
.ex code{background:#eef0f4;padding:1px 4px;border-radius:3px}.desc{color:#5b6475;font-size:12px;margin:2px 0 4px}
table{border-collapse:collapse;margin:8px 0}td,th{padding:3px 10px;border-bottom:1px solid #e3e6ec;text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body>
<h1>Trace Mining — Business use case → Workflow → Trace</h1>
<div class="sub" id="sub"></div>
<div id="notes"></div>
<div id="tree"></div>
<script>
const D = __DATA__;
const f = n => n == null ? "–" : Number(n).toLocaleString();
const p = x => x == null ? "–" : (100 * x).toFixed(1) + "%";
const T = D.totals;
document.getElementById("sub").textContent =
  `${f(T.traces)} traces · ${f(T.calls)} calls · recorded ${f(T.recorded.input_tokens)} in / ${f(T.recorded.output_tokens)} out · ` +
  `estimated ${f(T.estimated_cl100k_base.input_tokens)} in / ${f(T.estimated_cl100k_base.output_tokens)} out · ` +
  `${f(T.unknown.calls_with_unknown_usage)} calls with unknown usage. Bars = share of recorded input tokens.`;
document.getElementById("notes").innerHTML = "<table><tr><th>Usage basis</th><th>Meaning</th></tr>" +
  Object.entries(D.usage_notes).map(([k, v]) => `<tr><td>${k}</td><td style="text-align:left">${v}</td></tr>`).join("") + "</table>";
const row = (name, m) => `<span class="name">${name}</span><span class="bar"><i style="width:${100 * (m.recorded.input_share || 0)}%"></i></span>
  <span class="num">${p(m.recorded.input_share)} in · ${p(m.recorded.output_share)} out · ${f(m.traces)} traces · ${f(m.calls)} calls · est ${f(m.estimated_cl100k_base.input_tokens)} · unk ${f(m.unknown.calls_with_unknown_usage)}</span>`;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
document.getElementById("tree").innerHTML = D.hierarchy.map(u => `
 <details class="uc"><summary>${row(esc(u.use_case), u.metrics)}</summary><div class="desc">${esc(u.description)}</div>
 ${u.workflows.map(w => `<details class="wf"><summary>${row(esc(w.workflow), w.metrics)}</summary>
   <div class="desc">${esc(w.description)} · models: ${esc(Object.keys(w.top_models).join(", "))}</div>
   ${w.examples.map(e => `<div class="ex"><code>${e.trace_id}</code> (${e.calls} calls; ${esc(e.tools_called.join(", "))})<br>“${esc(e.excerpt)}”</div>`).join("")}
 </details>`).join("")}</details>`).join("");
</script></body></html>
